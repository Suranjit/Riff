name: '✨ Feature / Ticket'
description: 'Propose and design a feature before implementation (the Riff way).'
title: 'feat: <concise feature title>'
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Riff is built test-first, one tracked ticket at a time. A good ticket is a
        design doc: it should be complete enough that someone could write the
        failing tests from it. Please fill out every section.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected and when?
      placeholder: During a live meeting, participants cannot ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: The approach, data shapes, and interfaces. Diagrams welcome.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is explicitly in scope and out of scope for this ticket?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist of observable behaviors that define "done".
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test plan (written first)
      description: The unit and integration tests to author BEFORE implementation.
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Affected package(s)
      placeholder: shared, server, ui, mcp, cli
    validations:
      required: true
